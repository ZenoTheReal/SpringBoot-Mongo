spring.application.name=new-java-app
server.port=3000

# MongoDB Connection URI (Loaded from .env / environment variables)
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/springboot_db}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/springboot_db}




# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs


