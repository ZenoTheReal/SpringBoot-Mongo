spring.application.name=new-java-app
server.port=3000

# MongoDB Connection URI (Loaded from .env / environment variables)
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/springboot_db}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/springboot_db}

# Enable virtual threads for better concurrency and performance
spring.threads.virtual.enabled=true


# Swagger / OpenAPI
# Custom standalone UI is served directly from static/apidoc.html without redirects
springdoc.api-docs.path=/v3/api-docs


